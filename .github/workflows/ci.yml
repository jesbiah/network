name: Testing
on: push

jobs:
  test_project:
    runs-on: ubuntu-latest
    steps:
    -
      name: Set up Docker Compose
      uses: docker/setup-compose-action@v2
      with:
        version: latest
    - uses: actions/checkout@v7
    - name: Run Django and Selenium unit tests
      run: |
        docker compose run --build web python3 manage.py test