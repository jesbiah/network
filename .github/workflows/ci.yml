name: Testing
on: push

jobs:
  test_server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Run Django unit tests
      run: |
        pip3 install --user django
        pip3 install --user -r requirements.txt
        python3 project4/manage.py test

  test_javascript:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Run JavaScript tests with Selenium in headless mode
      run: |
        pip3 install --user -r requirements.txt
        python3 project4/tests.py